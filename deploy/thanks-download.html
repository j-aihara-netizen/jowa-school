<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料ダウンロード | JOWA SCHOOL</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/common.css">
  <script src="/assets/js/layout.js" defer></script>
  <style>
    .thanks-section {
      min-height: calc(100vh - 52px);
      display: flex; align-items: center; justify-content: center;
      padding: 80px 24px;
      background: var(--ice);
    }
    .thanks-card {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 560px; width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(14,116,144,.08);
    }
    .thanks-icon {
      width: 64px; height: 64px;
      background: #CFFAFE;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--teal);
      margin: 0 auto 24px;
    }
    .thanks-title {
      font-family: var(--font-disp);
      font-size: 26px; font-weight: 800;
      color: var(--ink); margin-bottom: 16px;
      letter-spacing: -.02em;
    }
    .thanks-lead {
      font-size: 15px; color: var(--sub);
      line-height: 1.85; margin-bottom: 36px;
    }
    .thanks-dl-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--teal); color: var(--white);
      padding: 16px 36px; border-radius: 100px;
      font-size: 15px; font-weight: 700;
      text-decoration: none;
      transition: background .15s, transform .15s;
      margin-bottom: 16px;
    }
    .thanks-dl-btn:hover {
      background: var(--teal-dark);
      transform: translateY(-2px);
    }
    .thanks-note {
      font-size: 12px; color: var(--sub); line-height: 1.7;
      margin-bottom: 36px;
    }
    .thanks-divider {
      border: none; border-top: 1px solid var(--rule);
      margin: 0 0 28px;
    }
    .thanks-links {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    }
    .thanks-links a {
      font-size: 13px; font-weight: 700; color: var(--teal);
      border-bottom: 1px solid rgba(14,116,144,.3);
      padding-bottom: 2px;
      transition: border-color .15s;
    }
    .thanks-links a:hover { border-color: var(--teal); }
    @media (max-width: 600px) {
      .thanks-card { padding: 40px 28px; }
      .thanks-title { font-size: 22px; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>

<section class="thanks-section">
  <div class="thanks-card">
    <div class="thanks-icon">✓</div>
    <h1 class="thanks-title">ありがとうございます</h1>
    <p class="thanks-lead">
      お申し込みが完了しました。<br>
      以下のボタンから資料をダウンロードしてください。
    </p>
    <a href="/assets/docs/jowa-school-programs.pdf" class="thanks-dl-btn" download>
      📄 資料をダウンロードする
    </a>
    <p class="thanks-note">
      ダウンロードが始まらない場合は、右クリック →「名前を付けて保存」をお試しください。
    </p>
    <hr class="thanks-divider">
    <div class="thanks-links">
      <a href="/">トップページへ戻る</a>
      <a href="/#programs">プログラムを見る</a>
      <a href="/#contact">お問い合わせ</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

</body>
</html>
