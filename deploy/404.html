<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/assets/images/jowa-logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | JOWA SCHOOL</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/common.css">
  <script src="/assets/js/layout.js" defer></script>
  <style>
    .nf-section {
      min-height: calc(100vh - 52px);
      display: flex; align-items: center; justify-content: center;
      padding: 80px 24px;
      background: var(--ice, #F0FDFA);
    }
    .nf-card {
      background: var(--white, #fff);
      border: 1px solid var(--rule, #B2DADE);
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 560px; width: 100%;
      text-align: center;
    }
    .nf-code {
      font-family: var(--font-disp, 'Plus Jakarta Sans', sans-serif);
      font-size: 64px; font-weight: 800; line-height: 1;
      color: var(--teal, #0E7490); letter-spacing: -.04em;
    }
    .nf-title {
      font-family: var(--font-disp, 'Plus Jakarta Sans', sans-serif);
      font-size: 20px; font-weight: 800; color: var(--ink, #0C1A1F);
      margin: 20px 0 12px;
    }
    .nf-desc {
      font-size: 14px; color: var(--sub, #4A6670); line-height: 1.8;
      margin-bottom: 28px;
    }
    .nf-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>

<div id="site-header"></div>

<section class="nf-section">
  <div class="nf-card">
    <div class="nf-code">404</div>
    <div class="nf-title">お探しのページが見つかりませんでした</div>
    <p class="nf-desc">URLが変更されたか、削除された可能性があります。<br>トップページから目的のプログラムをお探しください。</p>
    <div class="nf-btns">
      <a href="/" class="btn-primary">トップページへ →</a>
      <a href="/#programs" class="btn-outline">プログラム一覧</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

</body>
</html>
